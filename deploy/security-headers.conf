# =============================================================================
# HTTP security headers — NFR-S3 / SECURITY-04
#
# nginx form, for a self-managed Iranian host (Arvan Cloud / Abrarvan). The
# same policy is expressed in `public/_headers` for hosts that read that file.
# Whichever the deployment uses, ALL FIVE required headers must be present —
# they are a Round-1 obligation, not a Round-2 nicety, because the frontend
# ships before the backend does.
# =============================================================================

# --- Content-Security-Policy -------------------------------------------------
# No 'unsafe-inline' and no 'unsafe-eval', as NFR-S3 requires.
#
# This is only achievable because of choices made elsewhere:
#   - Vazirmatn is self-hosted, so font-src needs no third-party origin
#     (NFR-L5). This is the security payoff of a decision made for
#     availability reasons.
#   - no component uses an inline `style` attribute, so style-src-attr is not
#     needed (see src/ui/Skeleton.tsx).
#   - no `dangerouslySetInnerHTML` anywhere, banned by ESLint (NFR-S2).
#
# connect-src becomes the API origin in Round 2 and nothing else — the app
# talks to its own backend and to no analytics or third-party service, which
# is what makes NFR-S1's "contact details never leave" enforceable at the
# network layer rather than only by policy.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# --- Transport ---------------------------------------------------------------
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# --- Content handling --------------------------------------------------------
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# --- Capability restrictions -------------------------------------------------
# geolocation=() is not boilerplate. The product's second design principle is
# that the app NEVER learns a user's position — neighborhood is manual and
# coarse (CQ8 `B`). Denying the capability at the browser level means a future
# dependency cannot quietly request it.
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

# --- SPA routing -------------------------------------------------------------
location / {
    try_files $uri $uri/ /index.html;
}

location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location = /index.html {
    add_header Cache-Control "no-cache" always;
}
